<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Book — Web App</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6ff;--bg2:#fff;--card:rgba(255,255,255,.78);--line:rgba(17,22,40,.10);--text:#111628;--muted:#50587a;--p:#3b5bdb;--p2:#8a5cff;--g:#0ca789;--r:#d6334a}
:root[data-theme=dark]{--bg:#0b0f1a;--bg2:#121827;--card:rgba(24,31,52,.7);--line:rgba(255,255,255,.09);--text:#e8ecf8;--muted:#a9b3cc;--p:#8aa4ff;--p2:#a98bff;--g:#4de1c1;--r:#ff7a8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
.aurora i:nth-child(1){width:420px;height:420px;background:var(--p);top:-120px;left:-100px}
.aurora i:nth-child(2){width:380px;height:380px;background:var(--p2);bottom:-100px;right:-100px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:760px;margin:auto}
.logo{display:flex;gap:10px;align-items:center;font-weight:800}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;margin-left:6px}
main{max-width:760px;margin:auto;padding:0 16px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(14px)}
.stack>*+*{margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{border-radius:26px;padding:22px;color:#fff;background:linear-gradient(135deg,#4f6bff,#8a5cff 60%,#19c3a6)}
.hero small{opacity:.85}.hero h2{font-size:32px;letter-spacing:-.03em;margin:4px 0}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:20px;font-weight:800;margin-top:4px}
.up{color:var(--g)}.down{color:var(--r)}
h3{font-size:18px;margin:6px 0 2px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:default}
.item em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;color:var(--p)}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ln.b{font-weight:800}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;backdrop-filter:blur(18px);z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--muted);padding:11px 4px;border-radius:999px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.nav button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.fab{position:fixed;right:18px;bottom:84px;z-index:20;border:0;border-radius:999px;padding:15px 22px;color:#fff;font:700 15px inherit;font-family:inherit;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 14px 34px -10px var(--p);cursor:pointer}
.btn{border:0;border-radius:999px;padding:13px 22px;color:#fff;font:700 15px inherit;font-family:inherit;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:7px 14px;font-size:12px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;margin-top:6px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.55);display:grid;place-items:end center;z-index:50;backdrop-filter:blur(4px)}
.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px}
.row{display:flex;gap:10px;margin-top:18px}.row>*{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 16px;border-radius:999px;font:600 13px inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.auth{max-width:420px;margin:12vh auto;padding:0 16px}
.err{color:var(--r);font-size:13px;margin-top:12px;min-height:18px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:99}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i></div>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const fdate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

const cfg = window.APP_CONFIG || {};
if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('XXXX')) {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">config.js me Supabase URL aur anon key daalo.</p>';
  throw new Error('config missing');
}
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

let accounts = [], vouchers = [], tab = 'home', rtab = 'tb';
const TYPES = ['ASSET','LIABILITY','INCOME','EXPENSE','CAPITAL'];
const VTYPES = ['Receipt','Payment','Sales','Purchase','Journal','Contra'];
const LABELS = {
  Receipt:['Paisa kahan aaya (Debit)','Kisse mila (Credit)'],
  Payment:['Kisko diya (Debit)','Kahan se gaya (Credit)'],
  Sales:['Customer (Debit)','Sales account (Credit)'],
  Purchase:['Purchase account (Debit)','Supplier (Credit)'],
  Journal:['Debit account','Credit account'],
  Contra:['Cash/Bank me (Debit)','Cash/Bank se (Credit)']
};

/* ---------- theme ---------- */
let th = 'dark'; try { th = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch(e){}
function setTheme(t){ th=t; document.documentElement.dataset.theme=t; try{localStorage.setItem('theme',t)}catch(e){} const b=$('#thm'); if(b) b.textContent = t==='dark'?'🌙':'☀️'; }
setTheme(th);

/* ---------- auth ---------- */
function showAuth(msg=''){
  $('#root').innerHTML = `
  <div class="auth"><div class="card">
    <div class="logo" style="margin-bottom:18px"><b>₹</b> Account Book</div>
    <h3>Login / Naya account</h3>
    <label>Email<input id="em" type="email" autocomplete="email"></label>
    <label>Password (kam se kam 6 akshar)<input id="pw" type="password" autocomplete="current-password"></label>
    <div class="err" id="aerr">${esc(msg)}</div>
    <div class="row"><button class="btn" onclick="login()">Login</button><button class="btn ghost" onclick="signup()">Sign up</button></div>
  </div></div>`;
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  if (error) return $('#aerr').textContent = error.message;
  enter();
}
async function signup(){
  const {data, error} = await sb.auth.signUp({email:$('#em').value.trim(), password:$('#pw').value});
  if (error) return $('#aerr').textContent = error.message;
  if (!data.session) return $('#aerr').textContent = 'Email par confirm link bheja hai. Confirm karke login karo.';
  enter();
}
async function logout(){ await sb.auth.signOut(); accounts=[]; vouchers=[]; showAuth(); }

/* ---------- data ---------- */
async function enter(){ shell(); await load(); }

async function load(){
  const [a, v] = await Promise.all([
    sb.from('accounts').select('*').order('name'),
    sb.from('vouchers').select('*').order('date',{ascending:false}).order('created_at',{ascending:false})
  ]);
  if (a.error || v.error) return toast((a.error || v.error).message);
  accounts = a.data; vouchers = v.data;
  if (!accounts.length) {
    const {error} = await sb.from('accounts').insert([
      {name:'Cash',type:'ASSET'},{name:'Bank',type:'ASSET'},{name:'Sales',type:'INCOME'},
      {name:'Purchase',type:'EXPENSE'},{name:'Rent',type:'EXPENSE'},{name:'Salary',type:'EXPENSE'},{name:'Capital',type:'CAPITAL'}
    ]);
    if (error) return toast(error.message);
    return load();
  }
  render();
}

function balances(){
  return accounts.map(a => {
    let d = 0, c = 0;
    vouchers.forEach(v => { if (v.debit_id === a.id) d += +v.amount; if (v.credit_id === a.id) c += +v.amount; });
    const dn = a.type === 'ASSET' || a.type === 'EXPENSE';
    const net = dn ? +a.opening + d - c : +a.opening + c - d;
    return {...a, net, dr: dn ? net : -net};
  });
}
const nameOf = id => (accounts.find(a => a.id === id) || {}).name || '?';

/* ---------- UI shell ---------- */
function shell(){
  $('#root').innerHTML = `
  <div class="top"><div class="logo"><b>₹</b> Account Book</div>
    <div><button class="ib" id="thm" onclick="setTheme(th==='dark'?'light':'dark')"></button><button class="ib" onclick="logout()" title="Logout">⎋</button></div></div>
  <main id="main" class="stack"></main>
  <button class="fab" id="fab" onclick="openAdd()">＋ Entry</button>
  <div class="nav" id="nav"></div>`;
  setTheme(th);
}
function nav(){
  const items = [['home','🏠 Home'],['entries','🧾 Entries'],['accounts','👥 Accounts'],['reports','📊 Reports']];
  $('#nav').innerHTML = items.map(([k,l]) => `<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  $('#fab').textContent = tab === 'accounts' ? '＋ Account' : '＋ Entry';
}
function render(){
  nav();
  const b = balances();
  const m = $('#main');
  if (tab === 'home') m.innerHTML = home(b);
  else if (tab === 'entries') m.innerHTML = `<h3>Day Book</h3>` + (vouchers.length ? vouchers.map(v => vcard(v, true)).join('') : '<div class="empty">Koi entry nahi hai.</div>');
  else if (tab === 'accounts') m.innerHTML = `<h3>Accounts & Parties</h3>` + b.map(a => `
    <div class="card item" style="cursor:pointer" onclick="ledger('${a.id}')">
      <div>${esc(a.name)}<em>${a.type}${a.is_party ? ' • Party' : ''}</em></div><b>${inr(a.net)}</b></div>`).join('');
  else m.innerHTML = reports(b);
}
function vcard(v, del){
  return `<div class="card item"><div><span class="tag">${v.type} • ${fdate(v.date)}</span>
    <div style="font-weight:700;margin-top:3px">${esc(nameOf(v.debit_id))} → ${esc(nameOf(v.credit_id))}</div>
    ${v.narration ? `<em>${esc(v.narration)}</em>` : ''}</div>
    <div style="text-align:right"><b>${inr(v.amount)}</b>${del ? `<br><button class="btn ghost sm" style="margin-top:6px" onclick="delV('${v.id}')">Delete</button>` : ''}</div></div>`;
}
function sum(arr){ return arr.reduce((s,x) => s + x.net, 0); }
function home(b){
  const cb = sum(b.filter(a => a.type==='ASSET' && !a.is_party && /cash|bank/i.test(a.name)));
  const rec = sum(b.filter(a => a.type==='ASSET' && a.is_party));
  const pay = sum(b.filter(a => a.type==='LIABILITY' && a.is_party));
  const inc = sum(b.filter(a => a.type==='INCOME')), exp = sum(b.filter(a => a.type==='EXPENSE'));
  return `<div class="hero"><small>Cash + Bank</small><h2>${inr(cb)}</h2><small>Profit: ${inr(inc-exp)}</small></div>
  <div class="g2"><div class="card"><div class="lbl">Lena baki</div><div class="big up">${inr(rec)}</div></div>
  <div class="card"><div class="lbl">Dena baki</div><div class="big down">${inr(pay)}</div></div>
  <div class="card"><div class="lbl">Income</div><div class="big up">${inr(inc)}</div></div>
  <div class="card"><div class="lbl">Expense</div><div class="big down">${inr(exp)}</div></div></div>
  <h3>Recent entries</h3>` + (vouchers.length ? vouchers.slice(0,8).map(v => vcard(v,false)).join('') : '<div class="empty">+ dabakar pehli entry daalo.</div>');
}

/* ---------- reports ---------- */
function reports(b){
  const tabs = [['tb','Trial Balance'],['pl','Profit & Loss'],['bs','Balance Sheet']];
  let h = `<div class="tabs">${tabs.map(([k,l]) => `<button class="${rtab===k?'on':''}" onclick="rtab='${k}';render()">${l}</button>`).join('')}</div><div class="card">`;
  const L = (a,v,bold) => `<div class="ln ${bold?'b':''}"><span>${esc(a)}</span><span>${v}</span></div>`;
  if (rtab === 'tb') {
    let dr = 0, cr = 0;
    h += L('Account','Debit | Credit',true);
    b.forEach(a => { if (a.dr >= 0) { dr += a.dr; h += L(a.name, inr(a.dr)+' | -'); } else { cr += -a.dr; h += L(a.name, '- | '+inr(-a.dr)); } });
    h += L('Total', inr(dr)+' | '+inr(cr), true);
  } else if (rtab === 'pl') {
    const inc = b.filter(a => a.type==='INCOME'), exp = b.filter(a => a.type==='EXPENSE');
    h += '<b>Income</b>' + inc.map(a => L(a.name, inr(a.net))).join('') + L('Total Income', inr(sum(inc)), true);
    h += '<br><b>Expenses</b>' + exp.map(a => L(a.name, inr(a.net))).join('') + L('Total Expenses', inr(sum(exp)), true);
    const p = sum(inc) - sum(exp);
    h += L(p >= 0 ? 'Net Profit' : 'Net Loss', `<span class="${p>=0?'up':'down'}">${inr(p)}</span>`, true);
  } else {
    const A = b.filter(a => a.type==='ASSET'), Li = b.filter(a => a.type==='LIABILITY'), C = b.filter(a => a.type==='CAPITAL');
    const p = sum(b.filter(a => a.type==='INCOME')) - sum(b.filter(a => a.type==='EXPENSE'));
    h += '<b>Assets</b>' + A.map(a => L(a.name, inr(a.net))).join('') + L('Total Assets', inr(sum(A)), true);
    h += '<br><b>Liabilities</b>' + Li.map(a => L(a.name, inr(a.net))).join('');
    h += '<br><b>Capital</b>' + C.map(a => L(a.name, inr(a.net))).join('') + L(p>=0?'Current Profit':'Current Loss', inr(p));
    h += L('Total Liabilities + Capital', inr(sum(Li)+sum(C)+p), true);
  }
  return h + '</div>';
}

/* ---------- modals ---------- */
function modal(html){ closeM(); const d=document.createElement('div'); d.className='modal'; d.id='mdl'; d.onclick=e=>{if(e.target===d)closeM()}; d.innerHTML=`<div class="sheet">${html}</div>`; document.body.appendChild(d); }
function closeM(){ const m=$('#mdl'); if(m) m.remove(); }
const opts = () => '<option value="">-- chuno --</option>' + accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');

function openAdd(){ tab === 'accounts' ? addAccountModal() : addVoucherModal(); }

function addVoucherModal(){
  modal(`<h3>Nayi Entry</h3>
  <label>Voucher type<select id="vt" onchange="vtChange()">${VTYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
  <label id="dl">${LABELS.Receipt[0]}<select id="vd">${opts()}</select></label>
  <label id="cl">${LABELS.Receipt[1]}<select id="vc">${opts()}</select></label>
  <label>Amount<input id="va" type="number" min="0" step="0.01" inputmode="decimal"></label>
  <label>Date<input id="vdt" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
  <label>Narration (optional)<input id="vn"></label>
  <div class="err" id="verr"></div>
  <div class="row"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveV()">Save</button></div>`);
}
function vtChange(){
  const [d,c] = LABELS[$('#vt').value];
  $('#dl').firstChild.textContent = d; $('#cl').firstChild.textContent = c;
  $('#vd').value = ''; $('#vc').value = '';
}
async function saveV(){
  const debit_id = $('#vd').value, credit_id = $('#vc').value, amount = parseFloat($('#va').value);
  const err = m => $('#verr').textContent = m;
  if (!debit_id || !credit_id) return err('Dono account chuno');
  if (debit_id === credit_id) return err('Debit aur Credit alag hone chahiye');
  if (!(amount > 0)) return err('Amount sahi daalo');
  const {error} = await sb.from('vouchers').insert({
    type: $('#vt').value, debit_id, credit_id, amount, date: $('#vdt').value, narration: $('#vn').value.trim()
  });
  if (error) return err(error.message);
  closeM(); toast('Entry save ho gayi'); load();
}
async function delV(id){
  if (!confirm('Ye entry delete karni hai?')) return;
  const {error} = await sb.from('vouchers').delete().eq('id', id);
  if (error) return toast(error.message);
  load();
}
function addAccountModal(){
  modal(`<h3>Naya Account / Party</h3>
  <label>Naam<input id="an"></label>
  <label>Type<select id="at">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="ap" style="width:auto;margin-right:8px"> Customer / Supplier (Party)</label>
  <label>Opening balance<input id="ao" type="number" min="0" step="0.01" inputmode="decimal"></label>
  <div class="err" id="aerr2"></div>
  <div class="row"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveA()">Save</button></div>`);
}
async function saveA(){
  const name = $('#an').value.trim();
  if (!name) return $('#aerr2').textContent = 'Naam daalo';
  const {error} = await sb.from('accounts').insert({
    name, type: $('#at').value, is_party: $('#ap').checked, opening: parseFloat($('#ao').value) || 0
  });
  if (error) return $('#aerr2').textContent = error.message;
  closeM(); load();
}
function ledger(id){
  const a = balances().find(x => x.id === id);
  const list = vouchers.filter(v => v.debit_id===id || v.credit_id===id).sort((x,y) => x.date.localeCompare(y.date));
  modal(`<h3>Ledger: ${esc(a.name)}</h3>
  <div class="ln"><span>Opening</span><span>${inr(a.opening)}</span></div>
  ${list.map(v => { const d = v.debit_id===id; return `<div class="ln"><span>${fdate(v.date)} • ${d?'Dr':'Cr'} • ${esc(nameOf(d?v.credit_id:v.debit_id))}</span><span>${inr(v.amount)}</span></div>`; }).join('')}
  <div class="ln b"><span>Closing</span><span>${inr(a.net)}</span></div>
  <div class="row"><button class="btn" onclick="closeM()">Close</button></div>`);
}

/* ---------- start ---------- */
(async () => {
  const {data:{session}} = await sb.auth.getSession();
  session ? enter() : showAuth();
})();
</script>
</body>
</html>
